[package]
name = "joycon-studio"
version = "6.0.0"
description = "Atelier de bureau pour Joy-Con"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "joycon_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
# Accès HID natif : API HID de Windows, aucune compilation C/C++ côté utilisateur.
# Seul crate tiers du pilote ; il remplace ~300 lignes de FFI unsafe.
hidapi = "2"

[profile.dev]
opt-level = 1
incremental = false

[profile.release]
lto = true
codegen-units = 1
strip = true
